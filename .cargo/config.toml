# Link the MSVC C runtime statically so the Windows exe starts without the Visual C++
# Redistributable (VCRUNTIME140.dll), e.g. on a clean machine or the winget validation VM.
# scripts/check-windows-deps.ps1 verifies the result in the release workflow.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
