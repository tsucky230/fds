[package]
name = "fds"
version = "0.8.1"
edition = "2024"
authors = ["Qraft Node Kyoto"]
license = "GPL-3.0-only"
repository = "https://github.com/tsucky230/fds"
homepage = "https://tsucky230.github.io/fds/"

[features]
# Accept the TEST license key (debug builds only; a release build with it does not compile).
dev-license-key = []

[dependencies]
base64 = "0.23.1"
chardetng = "1.0.0"
ed25519-dalek = "3.0.0"
encoding_rs = "0.8.41"
flate2 = "1.1.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
jiff = "0.2.37"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.2"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
sys-locale = "0.3.2"
tar = "0.4.46"
tempfile = "3.27.0"
toml = "1.1.6"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
signal-hook = "0.4.4"

# Move to trash (M1-a): Windows uses IFileOperation directly so that an item which cannot be
# recycled is never deleted permanently; other platforms use the trash crate.
[target."cfg(windows)".dependencies]
windows = { version = "0.58", features = ["implement", "Win32_Foundation", "Win32_System_Com", "Win32_System_Console", "Win32_UI_Shell"] }

[target."cfg(not(windows))".dependencies]
trash = "5.2"

[package.metadata.cyclonedx]

[[package.metadata.cyclonedx.components]]
type = "library"
name = "fds-ops"
version = "0.8.1"
description = "File system operations: check, simple tasks, trash, worker pool, and name resolution"

[[package.metadata.cyclonedx.components]]
type = "library"
name = "fds-viewer"
version = "0.8.1"
description = "File content viewers: text, hex, image, markdown with encoding detection and rendering"

[[package.metadata.cyclonedx.components]]
type = "library"
name = "fds-ui"
version = "0.8.1"
description = "Terminal UI: panes, widgets, archive view, preview, info display, and input handling"

[[package.metadata.cyclonedx.components]]
type = "library"
name = "fds-cli"
version = "0.8.1"
description = "Command-line interface: shell command execution, editor integration, and terminal control"

[[package.metadata.cyclonedx.components]]
type = "library"
name = "fds-archive"
version = "0.8.1"
description = "Archive handling: pack/unpack tar and zip formats with compression support"

[[package.metadata.cyclonedx.components]]
type = "library"
name = "fds-i18n"
version = "0.8.1"
description = "Internationalization: multi-language support with user overrides"
