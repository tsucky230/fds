# Builds release binaries for 5 targets and publishes a GitHub Release when a v*.*.* tag is pushed.
# Run it manually (workflow_dispatch) for a dry run: everything except creating the Release.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          CARGO_VERSION=$(awk -F'"' '/^\[/{p=($0=="[package]")} p && /^version *=/{print $2; exit}' Cargo.toml)
          if [ "$REF_TYPE" = "tag" ]; then
            VERSION="${REF_NAME#v}"
            if [ "$VERSION" != "$CARGO_VERSION" ]; then
              echo "::error::Tag $REF_NAME does not match Cargo.toml version $CARGO_VERSION"
              exit 1
            fi
          else
            VERSION="$CARGO_VERSION"
            echo "Dry run for $VERSION: no GitHub Release will be created"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "is-prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check CHANGELOG and SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for f in CHANGELOG.md CHANGELOG_jp.md; do
            awk -v h="## [$VERSION]" 'index($0, h) == 1 { found = 1 } END { exit !found }' "$f" \
              || { echo "::error::$f has no '## [$VERSION]' entry"; exit 1; }
          done
          SBOM_VERSION=$(jq -r '.metadata.component.version' sbom/fds.cdx.json)
          if [ "$SBOM_VERSION" != "$VERSION" ]; then
            echo "::error::sbom/fds.cdx.json is $SBOM_VERSION, expected $VERSION. Tag the commit made by the SBOM workflow."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked --no-fail-fast

  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (GNU)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: fds
            
          # macOS x86_64 (Intel)
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: fds
            
          # macOS aarch64 (Apple Silicon / M1+)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: fds
            
          # Windows x86_64 (MSVC)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: fds.exe
            
          # Windows aarch64 (ARM64, for Surface/tablet devices)
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_name: fds.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      # A clean Windows (such as the winget validation VM) has no Visual C++ runtime, so the exe
      # must not import it (.cargo/config.toml links it statically). The runner has the runtime
      # installed, so --version here only shows that the x64 exe starts and reports the version.
      - name: Check Windows Runtime Dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
          EXE: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          TARGET: ${{ matrix.target }}
        run: |
          ./scripts/check-windows-deps.ps1 $env:EXE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:TARGET -like 'x86_64-*') {
            $out = (& $env:EXE --version) -join "`n"
            if ($LASTEXITCODE -ne 0 -or $out -ne "fds $env:VERSION") {
              Write-Host "::error::$env:EXE --version printed '$out' (exit $LASTEXITCODE), expected 'fds $env:VERSION'"
              exit 1
            }
          }

      - name: Stage Binary
        shell: bash
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          EXT="${{ matrix.artifact_name }}"
          EXT="${EXT#fds}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "dist/fds-${VERSION}-${{ matrix.target }}${EXT}"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  generate-checksums:
    name: Generate Checksums
    runs-on: ubuntu-latest
    needs: [validate-release, build-binaries]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true

      # Bare file names so users can run `sha256sum -c` next to the downloads
      - name: Generate SHA256 Checksums
        working-directory: dist
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          sha256sum fds-* > "fds-${VERSION}-checksums.sha256"
          cat "fds-${VERSION}-checksums.sha256"
          [ "$(wc -l < "fds-${VERSION}-checksums.sha256")" -eq 5 ]

      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  create-release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [validate-release, generate-checksums]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare Assets and Notes
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          cp sbom/fds.cdx.json "dist/fds-${VERSION}-sbom.cdx.json"
          awk -v h="## [$VERSION]" 'index($0, h) == 1 { f = 1; next } f && /^## \[/ { exit } f' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no notes for $VERSION"
            exit 1
          fi
          cat >> notes.md <<EOF

          ## Install

          Download the binary for your platform below and verify it:

          \`\`\`bash
          sha256sum -c --ignore-missing fds-${VERSION}-checksums.sha256
          \`\`\`

          Or build from source:

          \`\`\`bash
          cargo install --git https://github.com/tsucky230/fds --tag v${VERSION} --locked
          \`\`\`

          SBOM (CycloneDX): \`fds-${VERSION}-sbom.cdx.json\` · License: GPL-3.0-only
          EOF
          ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          name: fds ${{ needs.validate-release.outputs.version }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ needs.validate-release.outputs.is-prerelease }}
