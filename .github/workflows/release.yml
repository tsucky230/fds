# Automated Release Workflow
# Triggered when a version tag (v*.*.*) is pushed
# Builds binaries for Windows / macOS / Linux, creates GitHub Release with checksums
#
# Workflow Steps:
#  1. Validate tag format and version
#  2. Build optimized binaries for 5 platforms (x86_64/arm64 on Linux/macOS/Windows)
#  3. Generate SHA256 checksums for integrity verification
#  4. Create GitHub Release with release notes from CHANGELOG
#  5. Upload all artifacts (binaries + checksums + SBOM)
#  6. Publish to crates.io (Rust package registry)
#
# Trigger: Any tag matching v* (e.g., v0.8.0, v1.0.0)
name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Match semantic versioning tags only (e.g., v0.8.0, v1.0.0)

permissions:
  contents: write  # Allow creating releases and uploading assets

jobs:
  # Step 1: Validate tag and extract version information
  validate-release:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag-version.outputs.version }}
      is-prerelease: ${{ steps.tag-version.outputs.is-prerelease }}
    steps:
      - uses: actions/checkout@v4
      
      # Extract version from tag (e.g., v0.8.0 -> 0.8.0)
      - name: Extract Version from Tag
        id: tag-version
        run: |
          TAG="${{ github.ref }}"
          VERSION="${TAG#refs/tags/v}"  # Remove "refs/tags/v" prefix
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Detect if this is a pre-release (has alpha/beta/rc suffix)
          if [[ "$VERSION" =~ -(alpha|beta|rc) ]]; then
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
            echo "📋 Pre-release detected: $VERSION"
          else
            echo "is-prerelease=false" >> $GITHUB_OUTPUT
            echo "📦 Stable release: $VERSION"
          fi
      
      # Verify Cargo.toml version matches tag version
      - name: Verify Version Match
        run: |
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          TAG_VERSION="${{ steps.tag-version.outputs.version }}"
          
          if [ "$CARGO_VERSION" = "$TAG_VERSION" ]; then
            echo "✅ Version match confirmed: $CARGO_VERSION = $TAG_VERSION"
          else
            echo "❌ Version mismatch: Cargo.toml ($CARGO_VERSION) ≠ Tag ($TAG_VERSION)"
            exit 1
          fi

  # Step 2: Build optimized binaries for all target platforms
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (GNU)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: fds
            
          # macOS x86_64 (Intel)
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: fds
            
          # macOS aarch64 (Apple Silicon / M1+)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: fds
            
          # Windows x86_64 (MSVC)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: fds.exe
            
          # Windows aarch64 (ARM64, for Surface/tablet devices)
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_name: fds.exe

    steps:
      - uses: actions/checkout@v4
      
      # Install Rust and target toolchain
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      # Build optimized release binary (--release enables LTO and optimizations)
      - name: Build Release Binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      
      # Copy binary to output directory with version-specific name
      # Pattern: fds-{version}-{target}[.exe]
      - name: Prepare Artifact
        shell: bash
        run: |
          SRC_DIR="target/${{ matrix.target }}/release"
          DEST="${{ matrix.artifact_name }}"
          VERSION="${{ needs.validate-release.outputs.version }}"
          ARTIFACT_NAME="fds-${VERSION}-${{ matrix.target }}"
          
          if [ "${{ matrix.artifact_name }}" = "fds.exe" ]; then
            ARTIFACT_NAME="${ARTIFACT_NAME}.exe"
          fi
          
          cp "$SRC_DIR/${{ matrix.artifact_name }}" "$ARTIFACT_NAME"
          ls -lh "$ARTIFACT_NAME"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV
      
      # Upload binary as workflow artifact (temporary, for checksum generation)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-binary
          path: ${{ env.ARTIFACT_NAME }}
          retention-days: 1  # Keep only for checksum generation

  # Step 3: Generate SHA256 checksums for all binaries
  # This allows users to verify binary integrity after download
  generate-checksums:
    name: Generate Checksums
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      # Generate checksums in standard format for verification
      # Format: filename  checksum
      - name: Generate SHA256 Checksums
        run: |
          cd artifacts
          find . -type f ! -name "*.sha256" | sort | while read file; do
            sha256sum "$file" >> fds-${{ needs.validate-release.outputs.version }}-checksums.sha256
          done
          cat fds-${{ needs.validate-release.outputs.version }}-checksums.sha256
      
      # Upload checksums as artifact
      - name: Upload Checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: artifacts/fds-${{ needs.validate-release.outputs.version }}-checksums.sha256
          retention-days: 1

  # Step 4: Create GitHub Release with artifacts and release notes
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-release, build-binaries, generate-checksums]
    steps:
      - uses: actions/checkout@v4
      
      # Download all artifacts (binaries + checksums)
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      
      # Copy SBOM to release assets
      - name: Include SBOM in Release
        run: |
          cp sbom/fds.cdx.json release-assets/sbom-${{ needs.validate-release.outputs.version }}.json
          echo "✅ SBOM added to release assets"
      
      # Extract version and pre-release flag
      - name: Prepare Release Data
        id: release-data
        run: |
          VERSION="${{ needs.validate-release.outputs.version }}"
          IS_PRERELEASE="${{ needs.validate-release.outputs.is-prerelease }}"
          
          # Extract release notes from CHANGELOG.md for this version
          # Pattern: ## [VERSION] - DATE ... until next ## [
          CHANGELOG_ENTRY=$(awk "/^## \[$VERSION\]/,/^## \[/" CHANGELOG.md | head -n -1)
          
          # Store multi-line changelog in environment variable
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG_ENTRY"
            echo "EOF"
          } >> $GITHUB_ENV
      
      # Create the GitHub Release with all artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.validate-release.outputs.version }}
          name: Release ${{ needs.validate-release.outputs.version }}
          body: |
            # fds ${{ needs.validate-release.outputs.version }}

            ${{ env.changelog }}

            ## Installation

            ### From Binaries
            Download the binary for your platform from the assets below.
            Verify integrity using checksums:
            ```bash
            sha256sum -c fds-${{ needs.validate-release.outputs.version }}-checksums.sha256
            ```

            ### From Package Managers
            - **Rust/Cargo**: `cargo install fds --locked`
            - **Windows (winget)**: `winget install QraftNodeKyoto.fds`
            - **macOS (Homebrew)**: `brew install fds` (coming soon)

            ### From Source
            ```bash
            git clone https://github.com/tsucky230/fds.git
            cd fds
            git checkout v${{ needs.validate-release.outputs.version }}
            cargo install --path . --locked
            ```

            ## Supply Chain Security

            - **SBOM** (Software Bill of Materials): See `sbom-${{ needs.validate-release.outputs.version }}.json`
            - **Checksums**: Verify with `fds-${{ needs.validate-release.outputs.version }}-checksums.sha256`
            - **License**: GPL-3.0-only

          files: |
            release-assets/**/fds-*
            release-assets/**/checksums.sha256
            release-assets/**/sbom-*.json
          draft: false
          prerelease: ${{ needs.validate-release.outputs.is-prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # Step 5: Publish to crates.io (Rust package registry)
  # This makes `cargo install fds --locked` available to all Rust developers
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: validate-release
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
      
      # Publish to crates.io registry
      # Note: Requires CARGO_REGISTRY_TOKEN secret to be configured
      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --allow-dirty
        continue-on-error: true  # Don't fail if already published

  # Step 6: Notify completion
  # Summary of what was done
  release-summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [validate-release, create-release, publish-crates]
    if: always()
    steps:
      - name: Release Complete
        run: |
          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo "🎉 Release Workflow Complete"
          echo "════════════════════════════════════════════════════════════"
          echo "Version: ${{ needs.validate-release.outputs.version }}"
          echo "Pre-release: ${{ needs.validate-release.outputs.is-prerelease }}"
          echo ""
          echo "✅ Actions Completed:"
          echo "  • Binaries built for 5 platforms"
          echo "  • SHA256 checksums generated"
          echo "  • GitHub Release created with assets"
          echo "  • Published to crates.io"
          echo ""
          echo "📥 Installation:"
          echo "  cargo install fds --locked"
          echo ""
          echo "📖 Release Notes:"
          echo "  https://github.com/tsucky230/fds/releases/tag/v${{ needs.validate-release.outputs.version }}"
          echo "════════════════════════════════════════════════════════════"
